dataset: xjtu-sy
task_type: rul
processed_path: ../../data/processed/xjtu_sy_rul_v1.npz
output_dir: ../../artifacts
run_name: xjtu-sy-rul-v1
feature_schema_version: bearing-features-v1
window_size: 32768
stride: 32768
seed: 20260803
split:
  strategy: locked_group_manifest
  group: bearing_id
  manifest: ../../data/manifests/xjtu-rul-split-v1.json
preprocessing:
  fit_split: train
  feature_selector: not_configured
selection_split: validation
test_usage: final_selected_model_evaluation_once
leakage_audit_path: ../../data/processed/leakage-audit-v1.json
models:
  - algorithm: ridge
    hyperparameters:
      alpha: 1.0
  - algorithm: random_forest
    hyperparameters:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 2
      n_jobs: -1
  - algorithm: hist_gradient_boosting
    hyperparameters:
      max_iter: 150
      learning_rate: 0.05
evaluation_metric: mae
maximum_late_error: 3.0
maximum_rul_hours: 42.0
promotion_threshold:
  maximum_mae_hours: 5.0
  maximum_late_error_hours: 3.0
prediction_horizon: remaining hours to the observed final acquisition

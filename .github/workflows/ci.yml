name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maintenance_test
      SECRET_KEY: ci-test-secret-not-for-production
      AI_ENABLED: "false"
      SEED_ON_STARTUP: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify PostgreSQL schema initialization
        run: >-
          python -c "from app.db.migrations import upgrade_schema;
          from app.db.session import Base, engine;
          upgrade_schema(engine);
          Base.metadata.create_all(bind=engine)"

      - name: Run migration regression tests
        run: python -m pytest tests/test_database_migrations.py

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Build production frontend
        run: npm run build

  e2e:
    name: E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maintenance_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maintenance_e2e
      SECRET_KEY: ci-test-secret-not-for-production
      AI_ENABLED: "false"
      SEED_ON_STARTUP: "true"
      FRONTEND_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      PW_OUTPUT_DIR: test-results
      PW_REPORT_DIR: playwright-report
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start backend and wait for health
        working-directory: apps/api
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in {1..30}; do
            if response="$(curl -fsS http://127.0.0.1:8000/health 2>/dev/null)"; then
              if [[ "$response" == *'"database":"ok"'* ]]; then
                echo "$response"
                exit 0
              fi
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Build production frontend
        working-directory: apps/web
        run: npm run build

      - name: Start frontend and wait for health
        working-directory: apps/web
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/web.log"
          exit 1

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "Backend log:"
          if [[ -f "$RUNNER_TEMP/api.log" ]]; then cat "$RUNNER_TEMP/api.log"; else echo "Backend log not created"; fi
          echo "Frontend log:"
          if [[ -f "$RUNNER_TEMP/web.log" ]]; then cat "$RUNNER_TEMP/web.log"; else echo "Frontend log not created"; fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

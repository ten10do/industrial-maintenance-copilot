dataset: xjtu-sy
task_type: rul
processed_path: ../../data/processed/xjtu_sy_rul_v1.npz
output_dir: ../../artifacts
run_name: xjtu-sy-rul-v1
feature_schema_version: bearing-features-v1
window_size: 32768
stride: 32768
seed: 20260803
split:
  strategy: group_shuffle_split
  group: bearing_id
  validation_size: 0.2
  test_size: 0.2
models:
  - algorithm: ridge
    hyperparameters:
      alpha: 1.0
  - algorithm: random_forest
    hyperparameters:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 2
  - algorithm: hist_gradient_boosting
    hyperparameters:
      max_iter: 150
      learning_rate: 0.05
evaluation_metric: mae
maximum_late_error: 3.0
maximum_rul_hours: 42.0
promotion_threshold:
  maximum_mae_hours: 5.0
  maximum_late_error_hours: 3.0
prediction_horizon: remaining hours to the observed final acquisition

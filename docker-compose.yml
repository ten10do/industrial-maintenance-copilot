version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance-local-only
      POSTGRES_DB: maintenance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: imc-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgresql+psycopg://maintenance:maintenance-local-only@postgres:5432/maintenance
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - AI_ENABLED=false
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=./uploads
      - SEED_ON_STARTUP=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.runtime", "worker"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://maintenance:maintenance-local-only@postgres:5432/maintenance
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      - AI_ENABLED=false
      - SEED_ON_STARTUP=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime", "worker", "--check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.runtime", "scheduler"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://maintenance:maintenance-local-only@postgres:5432/maintenance
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      - AI_ENABLED=false
      - SEED_ON_STARTUP=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime", "scheduler", "--check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
    container_name: imc-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-uploads:
  postgres-data:

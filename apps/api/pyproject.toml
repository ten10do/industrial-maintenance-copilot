[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/endpoints/*.py" = ["B008"]
"../../scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
filterwarnings = ["error::sqlalchemy.exc.LegacyAPIWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = [
  "app/db/session.py",
  "app/db/alembic.py",
  "app/db/migrations.py",
  "app/gateways",
  "app/models/intelligence.py",
  "app/models/ml.py",
  "app/ml",
  "app/schemas/ml.py",
  "app/api/v1/endpoints/ml.py",
  "app/schemas/intelligence.py",
  "app/services/intelligence_service.py",
  "app/services/approval_service.py",
  "app/services/simulator.py",
  "app/runtime.py",
]

[[tool.mypy.overrides]]
module = ["joblib", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
